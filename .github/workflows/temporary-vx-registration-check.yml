name: Temporary VX registration verification

on:
  push:
    branches:
      - main

jobs:
  live-registration-check:
    if: github.event.head_commit.message == 'Run temporary VX registration verification'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Submit one authorized test registration
        shell: bash
        run: |
          set -euo pipefail
          payload='{"fullName":"اختبار فحص التسجيل","phone":"01000000000"}'
          response="$(curl --silent --show-error --max-time 30 \
            -X POST 'https://vx-pes-competition.vercel.app/api/register' \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            -w '\n__HTTP_STATUS__:%{http_code}')"
          status="$(printf '%s' "$response" | sed -n 's/^__HTTP_STATUS__://p' | tail -1)"
          body="$(printf '%s' "$response" | sed '/^__HTTP_STATUS__:/d')"
          echo "HTTP status: $status"
          echo "Response: $body"
          if [[ "$status" == "200" ]] && echo "$body" | grep -q '"ok":true'; then
            echo "Registration test passed."
          else
            echo "Registration test failed or was not confirmed by the server."
            exit 1
          fi
